services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Files in /docker-entrypoint-initdb.d are executed once, in filename
      # order, when the data directory is first initialised.  Naming the
      # migrations 001_…, 002_… guarantees the correct sequence.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Services ─────────────────────────────────────────────────────────────────

  booking-worker:
    build:
      context: ./booking-worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:    redis://redis:6379
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker implements its own startup retry loop in code, so container-level
    # restart is a last-resort safety net for truly unexpected crashes only.
    restart: unless-stopped

  status-service:
    build:
      context: ./status-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
      PORT:         3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  booking-api:
    build:
      context: ./booking-api
      dockerfile: Dockerfile
    environment:
      # Connection strings are assembled here so no service ever hardcodes a
      # host, port, or password — all values come from the .env file.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:    redis://redis:6379
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked into the static bundle at build time.
        # Within the Compose network, services are reachable by their service
        # name — but these URLs are resolved by the *browser*, not the container,
        # so they must be the host-facing ports (localhost:8000/3001).
        VITE_BOOKING_API_URL:    http://localhost:8000
        VITE_STATUS_SERVICE_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - booking-api
      - status-service
    restart: unless-stopped

volumes:
  postgres_data:
