# ── Minikube / local cluster example ─────────────────────────────────────────
# Copy this file to k8s/secret.yaml (which is gitignored) and apply:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# These are intentionally weak dev-only credentials.
# For production, replace every value with real secrets before applying.
#
# stringData accepts plain text — Kubernetes base64-encodes it at apply time.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: booking-secrets
  namespace: default
type: Opaque
stringData:
  # ── Application connection strings ────────────────────────────────────────
  # In production: swap @postgres:5432 for your RDS endpoint.
  DATABASE_URL: "postgresql://bookings:bookings_secret@postgres:5432/bookings"
  # In production: swap redis:6379 for your ElastiCache endpoint.
  REDIS_URL:    "redis://redis:6379"

  # ── Postgres pod init vars (k8s/local/ only) ──────────────────────────────
  # These three must match the user / password / db embedded in DATABASE_URL.
  # They are only read by the postgres StatefulSet in k8s/local/postgres.yaml.
  # When using RDS, these keys are not needed by any pod; you may omit them.
  POSTGRES_DB:       "bookings"
  POSTGRES_USER:     "bookings"
  POSTGRES_PASSWORD: "bookings_secret"
