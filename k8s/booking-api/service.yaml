apiVersion: v1
kind: Service
metadata:
  name: booking-api
  namespace: default
  labels:
    app: booking-api
spec:
  selector:
    app: booking-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  # ClusterIP keeps the API internal; expose externally via an Ingress or
  # change to LoadBalancer if you need a direct cloud load-balancer endpoint.
  type: ClusterIP
