apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-service
  namespace: default
  labels:
    app: status-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: status-service
  template:
    metadata:
      labels:
        app: status-service
    spec:
      # SSE clients reconnect automatically via EventSource retry; 30 s is
      # enough for in-flight keepalive writes to drain.
      terminationGracePeriodSeconds: 30

      containers:
        - name: status-service
          image: 276571117647.dkr.ecr.us-east-1.amazonaws.com/status-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: LOG_LEVEL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-secrets
                  key: DATABASE_URL
            - name: DB_SSL
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: DB_SSL

          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds:       20
            timeoutSeconds:      5
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds:       10
            timeoutSeconds:      5
            failureThreshold:    3
