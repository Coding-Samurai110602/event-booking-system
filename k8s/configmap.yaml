apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-config
  namespace: default
data:
  # Non-secret runtime configuration shared across all three services.
  # Connection strings (which embed passwords) live in k8s/secret.yaml.
  LOG_LEVEL:          "INFO"
  PORT:               "3001"    # status-service listen port
  HEALTH_PORT:        "3000"    # booking-worker probe server port
  # "true" for RDS (SSL required) — this is the CI/CD and production default.
  # Override to "false" only for local Docker Compose / Minikube where the
  # in-cluster Postgres does not use SSL.
  DB_SSL:             "true"
